<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Jobify account.">
    <title>Sign Up | Jobify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="logo">Jobify</a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="cv-form.html">Create CV</a>
        </nav>
    </div>
</header>

<main class="auth-main">

    <section class="auth-card">

        <div class="auth-heading">
            <span class="eyebrow">GET STARTED</span>
            <h1>Create Your Account</h1>
            <p>
                Create an account to start building your professional CV.
            </p>
        </div>

        <form id="signupForm" novalidate>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="button button-primary full-width">
                Create Account
            </button>

            <p id="signupMessage" class="form-message" role="alert"></p>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="index.html">Continue to Jobify</a>
        </div>

    </section>

</main>

<script src="script.js"></script>
</body>
</html>
